name: CI & Deploy to Render

# Runs the smoke test on every push, then (only if it passes) triggers a Render
# deploy via a Deploy Hook. The deploy step is a no-op until you add the
# RENDER_DEPLOY_HOOK_URL secret, so this workflow is safe to merge as-is.
on:
  push:
    branches:
      - master
      - main
      - claude/home-improvement-ida-app-sye0gy
  workflow_dispatch: {}

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run smoke

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy."
            echo "Add it under: repo Settings → Secrets and variables → Actions → New repository secret."
            exit 0
          fi
          echo "Smoke test passed — triggering Render deploy…"
          curl -fsS -X POST "$HOOK" > /dev/null && echo "✅ Render deploy triggered."
